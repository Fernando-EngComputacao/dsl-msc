version: '3.8'

services:
  neo4j:
    image: neo4j:5.15.0
    container_name: neo4j_cml
    ports:
      - "7687:7687"
      - "7474:7474"
    environment:
      - NEO4J_AUTH=neo4j/#UFG2026
    volumes:
      - neo4j_data:/data

  cml-app:
    build: .
    container_name: dsl_cml_engine
    depends_on:
      - neo4j
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/node_modules
      # Sem isto, os ~1 GB de pesos do Qwen sao rebaixados a cada recriacao do
      # container — e um download interrompido deixa um .incomplete que faz a
      # primeira inferencia travar sem erro.
      - hf_cache:/root/.cache/huggingface
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=#UFG2026
      # Opcional: evita o rate limit anonimo do Hugging Face Hub.
      - HF_TOKEN=${HF_TOKEN:-}
      # Troque para "outlines" so para reproduzir a comparacao de desempenho.
      - SPC_CML_BACKEND=${SPC_CML_BACKEND:-llamacpp}

volumes:
  neo4j_data:
  hf_cache: