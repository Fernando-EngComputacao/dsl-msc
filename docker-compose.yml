version: '3.8'

services:
  neo4j:
    image: neo4j:5.15.0
    container_name: neo4j_cml
    ports:
      - "7687:7687"
      - "7474:7474"
    environment:
      - NEO4J_AUTH=neo4j/#UFG2026
    volumes:
      - neo4j_data:/data

  cml-app:
    build: .
    container_name: dsl_cml_engine
    depends_on:
      - neo4j
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/node_modules 
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=#UFG2026

volumes:
  neo4j_data: